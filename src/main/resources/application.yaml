spring:
  application:
    name: inventory-management
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:}/${DB_NAME:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
        page-parameter: page
        size-parameter: size
  web:
    error:
      include-stacktrace: never
  cache:
    type: caffeine
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB

app:
  upload:
    dir: ${UPLOAD_DIR:./uploads/images}
    base-url: ${UPLOAD_BASE_URL:http://localhost:8080/uploads/images}
  jwt:
    access-expiration: ${JWT_ACCESS_EXPIRATION:900000}       # 15 minutes
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}   # 7 days
    secret: ${JWT_SECRET:2abb5fca-2b53-4251-8aa2-b62de8b00135-d8033911-b5bd-4137-9621-01009810bc6d}
    refresh-limit: 10
    refresh-limit-window: 60
  otp:
    pending-expiration: 50       # 50 seconds (single source of truth for OTP expiry)
    verified-expiration: 50
    max-requests: 5              # max wrong OTP attempts before code is invalidated
    limit-window: 50             # resend rate-limit window in seconds

server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}
